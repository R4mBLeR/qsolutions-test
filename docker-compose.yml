name: q-solution-test

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qsolution-backend
    restart: unless-stopped
    ports:
      - "3000:4002"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - qsolution-net

  postgres:
    image: postgres:16-alpine
    container_name: qsolution-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qsolution-net

volumes:
  postgres_data:

networks:
  qsolution-net:
    name: qsolution-net
